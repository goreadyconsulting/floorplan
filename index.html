<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floor Arrangement</title>
<style>
:root{--bg:#eef2f6;--panel:#fff;--ink:#172033;--muted:#6b778c;--line:#dce3ec;--navy:#102a43;--soft:#edf4fb;--danger:#b42318}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}
header{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.mark{width:34px;height:34px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800}.brand b{font-size:15px}.brand span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 62px)}
aside{background:#fff;border-right:1px solid var(--line);padding:16px;overflow:auto}.cap{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#77869b;margin:2px 0 9px}
form{display:grid;grid-template-columns:1fr 44px;gap:8px}input[type=text]{height:41px;border:1px solid var(--line);border-radius:9px;padding:0 10px;min-width:0;outline:none}input[type=text]:focus{border-color:#8ba8c7;box-shadow:0 0 0 3px rgba(16,42,67,.08)}input[type=color]{width:44px;height:41px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:4px}
.add{grid-column:1/-1;height:40px;border:0;border-radius:9px;background:var(--navy);color:#fff;font-weight:750}
#teams{display:flex;flex-direction:column;gap:7px;margin-top:16px}.team{display:grid;grid-template-columns:16px minmax(0,1fr) 28px;gap:9px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:10px}.team.active{background:#f6f9fd;border-color:#9eb6cf}.swatch{width:14px;height:14px;border-radius:50%}.teampick{border:0;background:transparent;text-align:left;padding:0;min-width:0}.teamname{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count{font-size:11px;color:var(--muted);margin-top:1px}.dots{border:0;background:transparent;border-radius:7px;height:28px}.dots:hover{background:#eef2f6}.empty,.help{font-size:12px;line-height:1.5;color:var(--muted)}.empty{padding:12px 2px}.hr{height:1px;background:var(--line);margin:18px 0}
main{min-width:0;display:grid;grid-template-rows:auto 1fr}.toolbar{min-height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;flex-wrap:wrap}.left,.right{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn{height:36px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 11px;font-size:12px;font-weight:700}.btn.active{background:var(--soft);border-color:#a9bfd5;color:#173f69}.btn:hover{background:#f7f9fb}.zoom{min-width:42px;text-align:center;color:var(--muted);font-size:12px}.labels{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stage-wrap{padding:12px;min-height:0}.stage{height:calc(100vh - 140px);min-height:480px;border:1px solid #c9d2dd;border-radius:12px;background:#cfd6df;position:relative;overflow:hidden;touch-action:none}.stage.move{cursor:grab}.stage.move.drag{cursor:grabbing}.stage.assign{cursor:crosshair}.canvas{position:absolute;left:0;top:0;width:1200px;transform-origin:0 0;user-select:none}.plan{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;-webkit-user-drag:none}.overlays{position:absolute;inset:0;pointer-events:none}.area{position:absolute;border:2px solid;border-radius:5px;pointer-events:none}.stage.manage .area{pointer-events:auto;cursor:pointer}.area.selected{box-shadow:0 0 0 3px #fff,0 0 0 6px #214f7d}.label{display:none;position:absolute;left:3px;top:3px;max-width:calc(100% - 6px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(15,23,42,.78);color:#fff;padding:2px 5px;border-radius:4px;font-size:10px;font-weight:700}.showlabels .label{display:block}.draft{position:absolute;border:2px dashed #102a43;background:rgba(16,42,67,.14);border-radius:5px}
.managebar{display:none;position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px;gap:7px;align-items:center;box-shadow:0 12px 35px rgba(15,23,42,.16);z-index:5}.managebar.open{display:flex}.managebar select{height:35px;border:1px solid var(--line);border-radius:8px;padding:0 28px 0 8px;min-width:150px;background:#fff}.danger{height:35px;border:1px solid #f0c4bf;background:#fff6f5;color:var(--danger);border-radius:8px;padding:0 10px;font-weight:700;font-size:12px}
.toast{position:absolute;right:20px;bottom:20px;background:#102a43;color:#fff;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:650;opacity:0;transform:translateY(6px);transition:.18s;pointer-events:none;z-index:10}.toast.show{opacity:1;transform:none}
.modalbg{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modalbg.open{display:flex}.modal{width:min(350px,100%);background:#fff;border-radius:14px;padding:18px;box-shadow:0 24px 70px rgba(15,23,42,.25)}.modal h2{font-size:16px;margin:0 0 13px}.modalgrid{display:grid;grid-template-columns:1fr 48px;gap:8px}.actions{margin-top:15px;display:flex;justify-content:space-between;gap:8px}.save{height:36px;border:0;background:var(--navy);color:#fff;border-radius:8px;padding:0 12px;font-weight:700}.ghost{height:36px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 12px;font-weight:700}
@media(max-width:820px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);max-height:250px}.stage{height:560px}.brand span{display:none}}@media(max-width:520px){header{padding:0 12px}.stage-wrap{padding:8px}.stage{height:500px;min-height:420px}.managebar{width:calc(100% - 24px);flex-wrap:wrap;justify-content:center}.managebar select{flex:1}.btn{padding:0 9px}}
</style>
</head>
<body>
<header><div class="brand"><div class="mark">FP</div><div><b>Floor Arrangement</b><span>Team allocation map</span></div></div><button id="clear" class="btn" type="button">Clear allocations</button></header>
<div class="shell">
<aside>
<div class="cap">Create team</div>
<form id="teamForm"><input id="teamName" type="text" maxlength="40" placeholder="Team name" autocomplete="off"><input id="teamColor" type="color" value="#2563eb"><button class="add" type="submit">Add team</button></form>
<div id="teams"></div><div id="empty" class="empty">Create a team, choose a colour, then select it before marking the floor plan.</div>
<div class="hr"></div><div class="cap">How to use</div><div class="help"><b>1.</b> Create and select a team.<br><b>2.</b> Choose <b>Assign area</b>.<br><b>3.</b> Drag over one desk or a group of desks.<br><b>4.</b> Use <b>Manage</b> to reassign or remove it.</div>
</aside>
<main>
<div class="toolbar"><div class="left"><button id="moveMode" class="btn active" type="button">Move map</button><button id="assignMode" class="btn" type="button">Assign area</button><button id="manageMode" class="btn" type="button">Manage</button></div><div class="right"><label class="labels"><input id="showLabels" type="checkbox">Show labels</label><button id="zoomOut" class="btn" type="button">−</button><span id="zoomLabel" class="zoom">100%</span><button id="zoomIn" class="btn" type="button">+</button><button id="fit" class="btn" type="button">Fit</button></div></div>
<div class="stage-wrap"><div id="stage" class="stage move"><div id="canvas" class="canvas"><img id="plan" class="plan" alt="Office floor plan"><div id="overlays" class="overlays"></div></div><div id="manageBar" class="managebar"><select id="reassign"></select><button id="apply" class="btn" type="button">Apply</button><button id="remove" class="danger" type="button">Remove</button></div><div id="toast" class="toast"></div></div></div>
</main>
</div>
<div id="modalbg" class="modalbg"><div class="modal"><h2>Edit team</h2><div class="modalgrid"><input id="editName" type="text" maxlength="40"><input id="editColor" type="color"></div><div class="actions"><button id="deleteTeam" class="danger" type="button">Delete team</button><div><button id="cancelEdit" class="ghost" type="button">Cancel</button> <button id="saveTeam" class="save" type="button">Save</button></div></div></div></div>
<script src="image-p1.js"></script>
<script>
(function(){
var MAP_W=1200,MAP_H=760,scale=1,tx=0,ty=0,mode="move",drag=false,start=null,base=null,draft=null,active=null,selected=null,editing=null;
var K1="fp-teams-v1",K2="fp-areas-v1",K3="fp-labels-v1";
var teams=load(K1,[]),areas=load(K2,[]);
var stage=q("#stage"),canvas=q("#canvas"),plan=q("#plan"),overlays=q("#overlays"),toast=q("#toast"),manageBar=q("#manageBar"),reassign=q("#reassign");
var teamColors=["#2563eb","#16a34a","#f97316","#9333ea","#0891b2","#e11d48","#ca8a04","#475569","#0f766e","#7c3aed"];
function q(s){return document.querySelector(s)}function load(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}function save(){localStorage.setItem(K1,JSON.stringify(teams));localStorage.setItem(K2,JSON.stringify(areas))}
function uid(p){return p+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,6)}function findTeam(id){return teams.find(function(t){return t.id===id})}
function rgba(hex,a){var n=parseInt(hex.replace("#",""),16);return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")"}
var timer;function note(s){clearTimeout(timer);toast.textContent=s;toast.classList.add("show");timer=setTimeout(function(){toast.classList.remove("show")},1700)}
plan.src="data:image/jpeg;base64,"+((window.__FLOOR_PLAN_PARTS||[]).join(""));
plan.onload=function(){MAP_H=MAP_W*(plan.naturalHeight/plan.naturalWidth);canvas.style.height=MAP_H+"px";fit()};
q("#showLabels").checked=load(K3,false);canvas.classList.toggle("showlabels",q("#showLabels").checked);
function renderTeams(){var box=q("#teams");box.innerHTML="";q("#empty").style.display=teams.length?"none":"block";var counts={};areas.forEach(function(a){counts[a.teamId]=(counts[a.teamId]||0)+1});teams.forEach(function(t){var r=document.createElement("div");r.className="team"+(active===t.id?" active":"");var s=document.createElement("span");s.className="swatch";s.style.background=t.color;var b=document.createElement("button");b.type="button";b.className="teampick";var n=document.createElement("div");n.className="teamname";n.textContent=t.name;var c=document.createElement("div");c.className="count";c.textContent=(counts[t.id]||0)+" area"+((counts[t.id]||0)===1?"":"s");b.append(n,c);b.onclick=function(){active=t.id;renderTeams();setMode("assign");note(t.name+" selected")};var d=document.createElement("button");d.type="button";d.className="dots";d.textContent="⋯";d.onclick=function(){editTeam(t.id)};r.append(s,b,d);box.append(r)});renderOptions()}
function renderOptions(){reassign.innerHTML="";teams.forEach(function(t){var o=document.createElement("option");o.value=t.id;o.textContent=t.name;reassign.append(o)});var a=areas.find(function(x){return x.id===selected});if(a)reassign.value=a.teamId}
function renderAreas(){overlays.innerHTML="";areas.forEach(function(a){var t=findTeam(a.teamId);if(!t)return;var e=document.createElement("div");e.className="area"+(a.id===selected?" selected":"");e.style.left=a.x+"%";e.style.top=a.y+"%";e.style.width=a.w+"%";e.style.height=a.h+"%";e.style.background=rgba(t.color,.28);e.style.borderColor=rgba(t.color,.95);var l=document.createElement("div");l.className="label";l.textContent=t.name;e.append(l);e.onpointerdown=function(ev){if(mode!=="manage")return;ev.stopPropagation();selected=a.id;renderAreas();renderOptions();manageBar.classList.add("open")};overlays.append(e)});renderTeams()}
q("#teamForm").onsubmit=function(ev){ev.preventDefault();var name=q("#teamName").value.trim();if(!name){note("Enter a team name");return}if(teams.some(function(t){return t.name.toLowerCase()===name.toLowerCase()})){note("That team already exists");return}var t={id:uid("team"),name:name,color:q("#teamColor").value};teams.push(t);active=t.id;q("#teamName").value="";q("#teamColor").value=teamColors[teams.length%teamColors.length];save();renderAreas();setMode("assign");note(name+" created")};
function editTeam(id){var t=findTeam(id);if(!t)return;editing=id;q("#editName").value=t.name;q("#editColor").value=t.color;q("#modalbg").classList.add("open")}
function closeEdit(){q("#modalbg").classList.remove("open");editing=null}q("#cancelEdit").onclick=closeEdit;q("#modalbg").onpointerdown=function(e){if(e.target===this)closeEdit()};
q("#saveTeam").onclick=function(){var t=findTeam(editing),name=q("#editName").value.trim();if(!t||!name)return;if(teams.some(function(x){return x.id!==t.id&&x.name.toLowerCase()===name.toLowerCase()})){note("That team already exists");return}t.name=name;t.color=q("#editColor").value;save();renderAreas();closeEdit();note("Team updated")};
q("#deleteTeam").onclick=function(){var t=findTeam(editing);if(!t)return;var count=areas.filter(function(a){return a.teamId===t.id}).length;if(!confirm("Delete "+t.name+(count?" and its allocated areas":"")+"?"))return;areas=areas.filter(function(a){return a.teamId!==t.id});teams=teams.filter(function(x){return x.id!==t.id});if(active===t.id)active=teams[0]?teams[0].id:null;selected=null;save();renderAreas();closeEdit();manageBar.classList.remove("open")};
function setMode(m){mode=m;["move","assign","manage"].forEach(function(x){stage.classList.toggle(x,x===m);q("#"+x+"Mode").classList.toggle("active",x===m)});if(m!=="manage"){selected=null;manageBar.classList.remove("open");renderAreas()}if(m==="assign"&&!active&&teams[0])active=teams[0].id;renderTeams()}
q("#moveMode").onclick=function(){setMode("move")};q("#assignMode").onclick=function(){if(!teams.length){note("Create a team first");return}setMode("assign")};q("#manageMode").onclick=function(){setMode("manage")};
function transform(){canvas.style.transform="translate("+tx+"px,"+ty+"px) scale("+scale+")";q("#zoomLabel").textContent=Math.round(scale*100)+"%"}
function fit(){var r=stage.getBoundingClientRect();scale=Math.max(.25,Math.min(2,Math.min((r.width-28)/MAP_W,(r.height-28)/MAP_H)));tx=(r.width-MAP_W*scale)/2;ty=(r.height-MAP_H*scale)/2;transform()}
function zoom(f){var r=stage.getBoundingClientRect(),cx=r.width/2,cy=r.height/2,old=scale;scale=Math.max(.25,Math.min(4,scale*f));var k=scale/old;tx=cx-(cx-tx)*k;ty=cy-(cy-ty)*k;transform()}q("#zoomIn").onclick=function(){zoom(1.18)};q("#zoomOut").onclick=function(){zoom(1/1.18)};q("#fit").onclick=fit;
function pt(e){var r=stage.getBoundingClientRect();return{x:Math.max(0,Math.min(MAP_W,(e.clientX-r.left-tx)/scale)),y:Math.max(0,Math.min(MAP_H,(e.clientY-r.top-ty)/scale))}}
function draftMove(s,p){var x=Math.min(s.x,p.x),y=Math.min(s.y,p.y),w=Math.abs(p.x-s.x),h=Math.abs(p.y-s.y);draft.style.left=(x/MAP_W*100)+"%";draft.style.top=(y/MAP_H*100)+"%";draft.style.width=(w/MAP_W*100)+"%";draft.style.height=(h/MAP_H*100)+"%"}
stage.onpointerdown=function(e){if(e.button!==0)return;if(mode==="manage"){if(e.target===stage||e.target===canvas||e.target===plan||e.target===overlays){selected=null;manageBar.classList.remove("open");renderAreas()}return}stage.setPointerCapture(e.pointerId);drag=true;start={x:e.clientX,y:e.clientY};if(mode==="move"){base={x:tx,y:ty};stage.classList.add("drag");return}if(!active){note("Select a team first");drag=false;return}var p=pt(e);draft=document.createElement("div");draft.className="draft";draft.dataset.x=p.x;draft.dataset.y=p.y;overlays.append(draft);draftMove(p,p)};
stage.onpointermove=function(e){if(!drag)return;if(mode==="move"){tx=base.x+(e.clientX-start.x);ty=base.y+(e.clientY-start.y);transform();return}if(mode==="assign"&&draft){var s={x:+draft.dataset.x,y:+draft.dataset.y};draftMove(s,pt(e))}};
stage.onpointerup=function(){if(!drag)return;drag=false;stage.classList.remove("drag");if(mode==="assign"&&draft){var x=parseFloat(draft.style.left),y=parseFloat(draft.style.top),w=parseFloat(draft.style.width),h=parseFloat(draft.style.height);draft.remove();draft=null;if(w<.55||h<.55){note("Drag a slightly larger area");return}areas.push({id:uid("area"),teamId:active,x:+x.toFixed(4),y:+y.toFixed(4),w:+w.toFixed(4),h:+h.toFixed(4)});save();renderAreas();note("Area assigned")}};
stage.onpointercancel=function(){drag=false;stage.classList.remove("drag");if(draft){draft.remove();draft=null}};
stage.addEventListener("wheel",function(e){e.preventDefault();var r=stage.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top,old=scale;scale=Math.max(.25,Math.min(4,scale*(e.deltaY<0?1.1:1/1.1)));var k=scale/old;tx=cx-(cx-tx)*k;ty=cy-(cy-ty)*k;transform()},{passive:false});
q("#apply").onclick=function(){var a=areas.find(function(x){return x.id===selected});if(!a)return;a.teamId=reassign.value;active=a.teamId;save();renderAreas();note("Area reassigned")};q("#remove").onclick=function(){areas=areas.filter(function(a){return a.id!==selected});selected=null;manageBar.classList.remove("open");save();renderAreas();note("Area removed")};
q("#clear").onclick=function(){if(!areas.length){note("No allocations to clear");return}if(!confirm("Clear every coloured allocation?"))return;areas=[];selected=null;manageBar.classList.remove("open");save();renderAreas();note("Allocations cleared")};
q("#showLabels").onchange=function(e){canvas.classList.toggle("showlabels",e.target.checked);localStorage.setItem(K3,JSON.stringify(e.target.checked))};window.onresize=function(){if(!drag)fit()};
renderAreas();setMode("move");setTimeout(fit,80);
})();
</script>
</body></html>
